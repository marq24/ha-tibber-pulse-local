name: Problem Report
description: Please report any technical issue with this home assistant integration - please note this is not a official Tibber repository or service
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: |
        ### The Integration is now available for +2 years. And looking back, there are two simple things that solved 99.89% of all issues – it's either:
        
        - _Option A_: Slightly rotate the pulse reading head anti-clockwise<br/>
        or
        - _Option B_: Replace the pulse batteries
        
        ### Please go though this short checklist - read each point carefully - TIA
      options:
        - label: This issue will be created by a human being **without any support** of AI tools like claude or chatgpt. I understand that issues created by AI tools will be instantly closed without any further support.
          required: true
        - label: I am aware, that marq24 is a grumpy old guy, so __it can happen__ that my issue will be closed instantly when essential information is missing (e.g. no debug logs provided, no issue description, no steps to reproduce the issue, etc...).
          required: true
        - label: I know, that any attachment send via eMail reply to a github issue notifications will be __ignored and deleted__ by github automatically. With other words __this will not work__!
          required: true
        - label: I have followed the install preparation procedure - including the verification part I, II & III.
          required: true
        - label: I have installed the **latest** release (or BETA) version of the integration and home assistant.
          required: true
        - label: I have prepared DEBUG log output (for technical issues) |
            In most of the cases of a technical error/issue I would have the need to ask for DEBUG log output of the integration. There is a short [tutorial/guide 'How to provide DEBUG log' here](https://github.com/marq24/ha-senec-v3/blob/main/docs/HA_DEBUG.md)
          required: true
        - label: I am aware that rotating the tibber pulse reading head anti clockwise can improve data quality |
            See [this user comment](https://github.com/marq24/ha-tibber-pulse-local/issues/6#issuecomment-1791117188) and the [next comment as well](https://github.com/marq24/ha-tibber-pulse-local/issues/6#issuecomment-1791130913)
          required: true
        - label: I confirm it's really an issue |
            In the case that you want to understand the functionality of a certain feature/sensor Please be so kind and make use if the discussion feature of this repo (and do not create an issue) - TIA
        - label: |
            I confirm, that I did not read any of the previous bulletin-points and just checked them all. | I don't wanted to waste my time with details, I don't read or follow any existing instructions. | Instead, I want that the maintainer of this repo will spend time explaining the world to me — that's marq24's job!. | I live by the motto: Better to ask twice, than to think about it once. | It's marq24's own fault that he provides open-source software and is willing to offer free support.
  - type: textarea
    id: content
    attributes:
      label: Add a description
      placeholder: "Please provide details about your issue - in the best case a short step by step instruction how to reproduce the issue - TIA."
  - type: textarea
    id: logs
    attributes:
      label: Add your DEBUG log output
      placeholder: "Please copy and paste any relevant **DEBUG LOG** output. This will be automatically formatted into code, so no need for backticks."
      render: shell